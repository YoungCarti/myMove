name: Trigger Codex Bot

on:
  pull_request_target:
    types: [labeled]

jobs:
  trigger-codex:
    if: github.event.label.name == 'codex-review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Trigger ChatGPT Codex Connector
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prompt = `
            @codex review this PR and let me know if there is anything to fix.
            
            Please identify any bugs, security vulnerabilities, or code quality issues in the changes.
            Categorize each issue with a priority: HIGH, MEDIUM, or LOW.
            
            For each issue, please provide:
            1. A clear description of the issue.
            2. The specific file and lines of code involved.
            3. A suggested fix.
            4. An exact prompt that I can copy and paste to my AI assistant to help me fix it and push directly to this PR.
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: prompt
            });
