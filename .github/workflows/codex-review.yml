name: Trigger Codex Bot

on:
  pull_request:
    types: [labeled]

jobs:
  trigger-codex:
    if: github.event.label.name == 'codex-review'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Trigger ChatGPT Codex Connector
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const prompt = `
            @codex review this PR and let me know if there is anything to fix. Please identify any bugs, security vulnerabilities, or code quality issues in the changes.
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: prompt
            });
